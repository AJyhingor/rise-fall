<style>

.rise.flash{animation:fl .45s infinite alternate}@keyframes fl{to{box-shadow:0 0 20px 5px #2ee59d;transform:scale(1.03)}}

.xb{width:24px;height:22px;border:1px solid #ff5c6c;background:#3a1620;color:#ff5c6c;border-radius:6px;font-weight:900;font-size:12px;padding:0;cursor:pointer}

.h3{font-size:10px;font-weight:900;color:var(--gold);letter-spacing:.6px;margin:10px 0 2px}.ck{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;margin:4px 0}.ck input{width:16px;height:16px}

.sp{display:none;position:absolute;inset:0;z-index:6;background:#081222fa;flex-direction:column;padding:6px}.sp.show{display:flex}
.sph{flex:none;display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:12px}

.sg4 div{border:1px solid #14263d;border-radius:10px;padding:8px 2px;text-align:center;background:#0e1c31}.sg4 b{display:block;font-size:11px;color:#8aa0c0}.sg4 span{font:900 20px ui-monospace,monospace}

</style></head><body><div class="app">
<div class="hd"><div><div class="nm">Ganeva • Boom 150 Auto</div><div class="st"><span id="dot" class="dot"></span><span id="stx">OFFLINE</span></div></div>
<div style="display:flex;gap:6px;align-items:flex-start"><button class="b" id="ib" style="height:30px;font-size:10px;padding:0 9px">RSIMA ▾</button><div class="rt"><div id="bal" class="bal mono">0.00</div><div id="pl" class="plb mono green">+0.00</div><div id="wl" class="sub">0W / 0L</div></div></div>
<div id="im" class="pm">

<div class="f"><label>RSI period (0 = hide line)</label><label>RSI apply to</label><input id="in_rp" class="inp" type="number" inputmode="numeric" style="height:30px;font-size:13px"><select id="in_ra" class="sel"><option value="close">Close</option><option value="open">Open</option><option value="high">High</option><option value="low">Low</option><option value="median">Median</option><option value="typical">Typical</option><option value="weighted">Weighted</option></select></div>
<div class="f"><label>RSI line px</label><label>RSI colour</label><input id="in_rw" class="inp" type="number" inputmode="numeric" style="height:30px;font-size:13px"><input id="in_rc" type="color"></div>

<div class="f"><label>MA apply to</label><label>MA line px</label><select id="in_ma" class="sel"><option value="close">Close</option><option value="open">Open</option><option value="high">High</option><option value="low">Low</option><option value="median">Median</option><option value="typical">Typical</option><option value="weighted">Weighted</option><option value="rsi">RSI data</option></select><input id="in_mw" class="inp" type="number" inputmode="numeric" style="height:30px;font-size:13px"></div>

<div class="f"><label>Pane scale low (visible bars)</label><label>Pane scale high</label><input id="in_sl" class="inp" type="number" inputmode="decimal" style="height:30px;font-size:13px"><input id="in_sh" class="inp" type="number" inputmode="decimal" style="height:30px;font-size:13px"></div>
<div class="h3">BUY ALERT</div>

<div class="f one"><label>BUY alert only when these times are all at the low level</label><select id="in_cf" class="sel"><option value="3">3 times: 5s + 15s + 1m</option><option value="4">4 times: 5s + 15s + 1m + 5m</option></select></div>
<div class="f one"><label>Pause between alerts (seconds)</label><input id="in_cd" class="inp" type="number" inputmode="numeric" style="height:30px;font-size:13px"></div>
<div id="er"></div><div class="ab"><button class="b" id="rst">Reset defaults</button><button class="b gob" id="app">Apply</button></div>
</div></div>
<div class="tfs" id="tfs"></div>
<div class="cw"><canvas id="cv"></canvas>
<div class="tb"><span id="tc" class="chip"></span><div class="row" style="width:150px"><button class="b" id="lv" style="display:none">Live</button><button class="b" id="au">AUTO: OFF</button></div></div>
<div id="msg"></div><div id="al" class="al"></div>
<div id="as" class="chip" style="position:absolute;left:6px;bottom:20px;z-index:5;display:none"></div>
<div id="cn" class="cn"><div><div class="lbl">Personal Access Token</div><input id="pat" class="inp" type="password" autocomplete="off" placeholder="Paste PAT"></div>
<div><div class="lbl">Account</div><select id="at" class="inp"><option value="demo">DEMO</option><option value="real">REAL</option></select></div><button id="cb" class="go">CONNECT</button></div></div>
<div class="row" style="align-items:center"><div class="lbl" style="flex:2;margin:0">Rise/Fall · Expiry (fixed)</div><input id="ev" class="inp mono" type="text" readonly style="flex:.8;text-align:center;height:30px;font-size:14px;font-weight:900"></div>
<div class="row"><button class="b" id="hv" style="flex:.6">½</button><input id="sk" class="inp mono" type="number" min="0.35" step="0.01" style="flex:2;text-align:center;height:32px"><button class="b" id="db" style="flex:.6">×2</button></div>
<div class="row"><button class="rise" id="up">▲ BUY<small id="u2"></small></button><button class="fall" id="dn">▼ SELL<small id="d2"></small></button></div>
<div class="pr"><div class="row"><button class="b" id="bp">Positions <span id="np">0</span> ▾</button><button class="b" id="bh">History <span id="nh">0</span> ▾</button></div><div id="dp" class="dd"></div><div id="dh" class="dd"></div></div>
</div>
<script>
"use strict";
const APP="3447X0mxYSFx7iRN27jhP",API="https://api.derivws.com",$=i=>document.getElementById(i),sleep=ms=>new Promise(r=>setTimeout(r,ms));
let SYM="BOOM150N";const NAME="Boom 150";
const TFS=[[5,"5s","5 second"],[15,"15s","15 second"],[60,"1m","1 minute"],[300,"5m","5 minute"]],EXP=30,MINB=12;
const DEF={tf:5,stake:0.35,rm:{on:true,lo:10,hi:90,rsiP:0,rsiApply:"close",rsiW:1,rsiCol:"#7aa2ff",maP:9,maM:"ema",maApply:"typical",maW:1,maCol:"#ff9f43",sLo:10,sHi:90,scale:200,sigMode:"live",conf:"3",cool:30}};
let S=JSON.parse(JSON.stringify(DEF));
try{const z=JSON.parse(localStorage.getItem("bm150")||"{}");if(TFS.some(t=>t[0]===z.tf))S.tf=z.tf;if(z.stake>=0.35)S.stake=+z.stake;if(z.rm)Object.assign(S.rm,z.rm)}catch(e){}
const save=()=>{try{localStorage.setItem("bm150",JSON.stringify(S))}catch(e){}};
const tfn=f=>(TFS.find(t=>t[0]===f)||[0,f+"s"])[1];
const D={p:0,pip:2,t:{}},getT=f=>D.t[f]||(D.t[f]={c:[],ok:0,ld:0}),bk=(f,e)=>Math.floor(e/f)*f;
let ws=null,pat="",account=null,authed=false,connecting=false,lastMsg=0,pingAt=0,rtt=0,req=0,reqs=new Map(),cur="USD",open=new Map(),hist=[],real=0,W=0,L=0,wake=null,SK="underlying_symbol",raf=0,pw=0,sc=0,symSwapped=false;const q=[];
try{const z=JSON.parse(localStorage.getItem("bm150h")||"{}");real=+z.real||0;W=+z.W||0;L=+z.L||0;hist=Array.isArray(z.hist)?z.hist:[]}catch(e){}
const persist=()=>{try{localStorage.setItem("bm150h",JSON.stringify({real,W,L,hist}))}catch(e){}};
const msg=(t,c)=>{$("msg").textContent=t;$("msg").style.color=c||"var(--muted)"};
const stat=(on,t)=>{$("dot").className="dot"+(on?" on":"");$("stx").textContent=t};
const rd=()=>{if(!raf)raf=requestAnimationFrame(()=>{raf=0;draw()})};

/* ---------- UI ---------- */
TFS.forEach(z=>{const b=document.createElement("button");b.className="b";b.dataset.f=z[0];b.innerHTML=z[1]+"<small>…</small>";b.onclick=()=>{S.tf=z[0];save();V.off=0;paint();rd()};$("tfs").appendChild(b)});
function paintU(){const t=EXP+"s";$("u2").textContent=$("d2").textContent=t+" • "+(+S.stake).toFixed(2)}
function paint(){
  [...$("tfs").children].forEach(b=>b.classList.toggle("on",+b.dataset.f===S.tf));
  $("ev").value=EXP+"s";
  $("tc").textContent=NAME+" • "+tfn(S.tf);
  if(document.activeElement!==$("sk"))$("sk").value=S.stake;paintU()}
$("dp").addEventListener("pointerdown",e=>{const b=e.target.closest("[data-x]");if(b){e.preventDefault();closeM(+b.dataset.x)}});
$("sk").oninput=()=>{S.stake=Number($("sk").value)||0;save();paintU()};
$("hv").onclick=()=>{S.stake=Math.max(0.35,Math.round(S.stake/2*100)/100);save();paint()};
$("db").onclick=()=>{S.stake=Math.round(S.stake*2*100)/100;save();paint()};
$("lv").onclick=()=>{V.off=0;rd()};
["up","dn"].forEach(id=>$(id).addEventListener("pointerdown",e=>{e.preventDefault();buy(id==="up"?1:0)}));
function drop2(a,b){const x=$(a),y=$(b);y.classList.remove("show");x.classList.toggle("show");lists()}
$("bp").onclick=()=>drop2("dp","dh");$("bh").onclick=()=>drop2("dh","dp");
document.addEventListener("pointerdown",e=>{
  if(!e.target.closest("#im,#ib"))$("im").classList.remove("show");
  if(!e.target.closest(".pr")){$("dp").classList.remove("show");$("dh").classList.remove("show")}
  try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume()}catch(x){}keep()},true);
paint();

/* ---------- connection ---------- */
async function fj1(u,o){const c=new AbortController(),t=setTimeout(()=>c.abort(),10000);let r,x;try{r=await fetch(u,Object.assign({},o,{signal:c.signal}));x=await r.text()}catch(e){throw new Error("Network timeout")}finally{clearTimeout(t)}let d;try{d=JSON.parse(x)}catch(e){throw new Error("Server "+r.status+" "+x.slice(0,60))}if(!r.ok)throw new Error(((d.errors&&d.errors[0]&&d.errors[0].message)||d.message||"HTTP")+" "+r.status);return d}
async function fj(u,o){for(let a=1;;a++){try{return await fj1(u,o)}catch(e){if(a>=3||!/internal|server|\b5\d\d\b|timeout|temporar|unavailable/i.test(e.message))throw e;await sleep(300*a)}}}
const hd=()=>({"Deriv-App-ID":APP,"Authorization":"Bearer "+pat});
async function getAcc(){const d=await fj(API+"/trading/v1/options/accounts",{headers:hd()});const l=Array.isArray(d.data)?d.data:d.data?[d.data]:(d.accounts||[]),w=$("at").value;const f=l.find(a=>String(a.account_type||a.type||a.accountType||"").toLowerCase()===w);if(!f)throw new Error("No "+w.toUpperCase()+" account for this PAT");f.account_id=f.account_id||f.accountId||f.id;f._w=w;account=f}
function ovl(){$("cn").style.display=pat?"none":"flex"}
async function connect(){
  if(connecting)return;const t=$("pat").value.trim();if(t&&t!==pat){pat=t;account=null}if(!pat){msg("Paste your Deriv PAT first.","var(--red)");return}
  connecting=true;ovl();stat(false,"CONNECTING");
  try{if(!(account&&account._w===$("at").value))await getAcc();
    const o=await fj(API+"/trading/v1/options/accounts/"+encodeURIComponent(account.account_id)+"/otp",{method:"POST",headers:hd()});
    const url=o.data&&o.data.url;if(!url)throw new Error("No WebSocket URL");await openWS(url)}
  catch(e){connecting=false;stat(false,"OFFLINE");msg(e.message,"var(--red)");if(/unauthor|invalid|forbidden|\b40[13]\b/i.test(e.message)){pat="";ovl()}}}
function openWS(url){return new Promise((res,rej)=>{let ok=false;const s=new WebSocket(url);ws=s;
  const to=setTimeout(()=>{if(!ok){try{s.close()}catch(e){}rej(new Error("Connection timeout"))}},12000);
  s.onopen=async()=>{ok=true;clearTimeout(to);connecting=false;authed=true;lastMsg=Date.now();stat(true,"ONLINE");msg("");
    send({balance:1,subscribe:1});open.forEach(c=>send({proposal_open_contract:1,contract_id:c.id,subscribe:1}));
    q.length=0;sync();TFS.forEach(z=>{const t=getT(z[0]);t.ok=0;t.ld=0});
    await resolveSym();send({ticks:SYM,subscribe:1});show();keep();res()};
  s.onmessage=e=>{if(ws!==s)return;lastMsg=Date.now();let d;try{d=JSON.parse(e.data)}catch(x){return}onMsg(d)};
  s.onclose=()=>{clearTimeout(to);if(ws!==s)return;authed=false;if(!ok)rej(new Error("Connection closed"));else stat(false,"OFFLINE")}})}
function dropWS(){const w=ws;ws=null;authed=false;if(w){w.onmessage=w.onclose=null;try{w.close()}catch(e){}}stat(false,"OFFLINE")}
function send(p){if(!ws||ws.readyState!==1)return false;try{ws.send(JSON.stringify(p));return true}catch(e){return false}}
function rq1(p,t){return new Promise((res,rej)=>{const id=++req;p.req_id=id;const tm=setTimeout(()=>{reqs.delete(id);rej(new Error("Request timed out"))},t||10000);reqs.set(id,{res,rej,tm});if(!send(p)){clearTimeout(tm);reqs.delete(id);rej(new Error("Not connected"))}})}
async function rq(p,t,n){n=n===undefined?2:n;for(let a=0;;a++){try{return await rq1(Object.assign({},p),t)}catch(e){if(a>=n||!/internal|server error|temporar|unavailable|error occurred/i.test(e.message))throw e;await sleep(250*(a+1))}}}
/* find the exact Deriv symbol of the Boom 150 Index */
async function resolveSym(){try{const d=await rq({active_symbols:"brief",product_type:"basic"},8000,0),l=d.active_symbols||[];
  const a=l.find(x=>/^boom\s*150\b/i.test(String(x.display_name||x.underlying_symbol_name||x.symbol_name||"")))||l.find(x=>/^BOOM150N?$/i.test(String(x.underlying_symbol||x.symbol||"")));
  const y=a&&(a.underlying_symbol||a.symbol);if(y&&y!==SYM)SYM=y}catch(e){}}
async function keep(){try{if(navigator.wakeLock&&document.visibilityState==="visible"&&!(wake&&!wake.released))wake=await navigator.wakeLock.request("screen")}catch(e){}}
$("cb").onclick=()=>{if(!authed)connect()};
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){keep();if(pat&&!authed)connect()}});
window.addEventListener("online",()=>{if(pat&&!authed)connect()});
setInterval(()=>{
  if(pat){if(!authed){if(!connecting)connect()}
    else if(!ws||ws.readyState!==1||Date.now()-lastMsg>6000){dropWS();connect()}
    else{pingAt=Date.now();send({ping:1});stat(true,(rtt>1500?"SLOW ":"ONLINE ")+rtt+"ms")}}
  renderPL();lists();if(authed&&++sc%20===0)sync()},1000);

function onMsg(d){

    if(d.echo_req&&d.echo_req.ticks&&!reqs.get(d.req_id)&&!symSwapped){symSwapped=true;SYM=/N$/.test(SYM)?SYM.slice(0,-1):SYM+"N";send({ticks:SYM,subscribe:1});TFS.forEach(z=>{const t=getT(z[0]);t.ok=0;t.ld=0;t.c=[]});show();return}

const isRate=e=>/rate|too many|limit/i.test(e.message||""),isInt=e=>/internal|server error|error occurred|timed out|temporar/i.test(e.message||"");
async function findNew(pr,amt,t0){try{const d=await rq({portfolio:1},6000,0),l=(d.portfolio&&d.portfolio.contracts)||[];
  const c=l.find(x=>!open.has(+x.contract_id)&&x.symbol===pr[SK]&&Math.abs(+x.buy_price-amt)<.011&&+x.purchase_time>=t0-3);return c?{buy:{contract_id:c.contract_id,payout:c.payout}}:null}catch(e){return null}}
async function tryBuy(pr,amt,t0){
  for(let a=0;a<3;a++){
    try{return await rq({buy:1,price:amt,parameters:pr},9000,0)}
    catch(e){const m=e.message||"";
      if(/symbol/i.test(m)&&a===0){const v=pr[SK];delete pr[SK];SK=SK==="symbol"?"underlying_symbol":"symbol";pr[SK]=v;continue}
      if(isRate(e)){await sleep(300);continue}
      if(isInt(e)){const f=await findNew(pr,amt,t0);if(f)return f;if(a<2){await sleep(200);continue}}
      throw e}}
  throw new Error("Buy failed")}
async function buy(up,amt0,auto){
  if(!authed){msg("Connect to Deriv first.","var(--red)");return false}
  const amt=Math.round(Number(amt0||S.stake)*100)/100;if(!(amt>=0.35)){msg("Minimum stake is 0.35","var(--red)");return false}
  const side=up?"CALL":"PUT",t0=Date.now()/1000,pr={amount:amt,basis:"stake",contract_type:side,currency:cur,duration:EXP,duration_unit:"s"};pr[SK]=SYM;
  const lb=(auto?"AUTO ":"")+(up?"▲ BUY ":"▼ SELL ")+NAME+" "+EXP+"s • "+amt.toFixed(2);msg(lb+" sending...");
  try{const r=await tryBuy(pr,amt,t0),b=r.buy;if(!b||!b.contract_id)throw new Error("No buy confirmation");const id=+b.contract_id;
    open.set(id,{id,side,sym:SYM,name:NAME,ex:EXP,mult:0,stake:amt,entry:0,pl:0,auto:!!auto,end:Date.now()/1000+EXP});send({proposal_open_contract:1,contract_id:id,subscribe:1});
    msg("Bought "+lb+" • "+Math.round((Date.now()/1000-t0)*1000)+"ms","var(--green)");lists();return true}
  catch(e){msg(e.message+" (If Deriv does not offer 30s Rise/Fall on Boom 150, the trade cannot be placed.)","var(--red)");return false}}
/* ---------- AUTO: after a BUY signal, buy at second 55 of every 1m candle that is down; stake +0.10 after each loss; stop at the first win ---------- */
const AU={on:false,hunt:false,loss:0,lastC:0,busy:false,tk:0,tl:0},STEP=0.10;
const astake=()=>Math.round((Math.max(0.35,+S.stake||0.35)+STEP*AU.loss)*100)/100;
function autoUI(){$("au").textContent="AUTO: "+(AU.on?"ON":"OFF");$("au").classList.toggle("on",AU.on);const e=$("as");
  e.style.display=AU.on?"block":"none";e.textContent=!AU.on?"":AU.hunt?"HUNTING · buy at 55s on down 1m candle · next stake "+astake().toFixed(2)+" · losses "+AU.loss:"Waiting for BUY signal"}
function armAuto(){if(!AU.on||AU.hunt)return;AU.hunt=true;AU.loss=0;AU.lastC=0;autoUI()}
$("au").onclick=()=>{AU.on=!AU.on;if(!AU.on){AU.hunt=false;AU.loss=0}autoUI();msg(AU.on?"Auto ON - waiting for a BUY signal":"Auto OFF")};
function autoResult(win){if(win){AU.hunt=false;AU.loss=0;msg("PUMP! Auto won and stopped. Waiting for the next BUY signal.","var(--green)")}else AU.loss++;autoUI()}
async function autoTick(){
  if(!AU.on||!AU.hunt||!authed||AU.busy||!AU.tk||Date.now()-AU.tl>5000||open.size)return;
  const now=AU.tk+(Date.now()-AU.tl)/1000,c=Math.floor(now/60)*60,sec=now-c;
  if(sec<55||sec>=58.5||AU.lastC===c)return;
  const t=D.t[60],k=t&&t.ok&&t.c[t.c.length-1];if(!k||k.epoch!==c)return;
  AU.lastC=c;if(!(k.close<k.open))return;
  const amt=astake();if(BAL&&amt>BAL){AU.hunt=false;autoUI();msg("Auto stopped: stake "+amt.toFixed(2)+" is above your balance","var(--red)");return}
  AU.busy=true;try{await buy(1,amt,true)}finally{AU.busy=false}autoUI()}
setInterval(autoTick,250);autoUI();
async function closeM(id){const t=open.get(id);if(!t||t.closing)return;t.closing=1;msg("Closing "+t.name+"...");
  try{await rq({sell:id,price:0},9000,1);send({proposal_open_contract:1,contract_id:id})}catch(e){t.closing=0;msg(e.message,"var(--red)")}}
async function sync(){try{const d=await rq({portfolio:1},8000),l=(d.portfolio&&d.portfolio.contracts)||[],ids=new Set(l.map(c=>+c.contract_id));
  l.forEach(c=>{const id=+c.contract_id;if(open.has(id))return;const a=+c.purchase_time||0,z=+c.expiry_time||+c.date_expiry||0,ct=String(c.contract_type||"");
    open.set(id,{id,side:/^MULT/.test(ct)?ct:/^PUT/.test(ct)?"PUT":/^CALL/.test(ct)?"CALL":ct,mult:/^MULT/.test(ct)?100:0,sym:c.symbol,name:/^BOOM150/.test(c.symbol||"")?NAME:(c.symbol||"?"),ex:z&&a?Math.max(1,Math.round(z-a)):0,stake:+c.buy_price||0,entry:0,pl:0,end:/^MULT/.test(ct)?0:z});
    send({proposal_open_contract:1,contract_id:id,subscribe:1})});
  open.forEach(o=>{if(!ids.has(o.id))send({proposal_open_contract:1,contract_id:o.id})});
  lists();renderPL();rd()}catch(e){}}
function poc(p){const t=p&&open.get(+p.contract_id);if(!t)return;
  if(p.entry_spot!==undefined)t.entry=+p.entry_spot;if(p.date_expiry)t.end=+p.date_expiry;t.pl=Number(p.profit)||0;
  if(p.is_sold||p.status==="won"||p.status==="lost"){open.delete(t.id);real+=t.pl;t.pl>0?W++:L++;hist.unshift(t);hist.length=Math.min(hist.length,50);persist();if(t.auto)autoResult(t.pl>0);msg((t.pl>0?"WIN +":"LOSS ")+t.pl.toFixed(2),t.pl>0?"var(--green)":"var(--red)")}
  renderPL();lists();rd()}
function renderPL(){const t=real,e=$("pl");e.textContent=(t>=0?"+":"")+t.toFixed(2);e.className="plb mono "+(t>=0?"green":"red");$("wl").textContent=W+"W / "+L+"L"}
function row(t,live){const mu=!!t.mult||/^MULT/.test(t.side),left=Math.max(0,Math.round(t.end-Date.now()/1000)),tm=live&&!mu?" • "+Math.floor(left/60)+":"+String(left%60).padStart(2,"0"):"";
  const pl='<b class="'+(t.pl>=0?"green":"red")+'">'+(t.pl>=0?"+":"")+t.pl.toFixed(2)+"</b>",xb=live&&mu?'<button class="xb" data-x="'+t.id+'">x</button>':"";
  return '<div class="k mono"><span>'+(isUp(t.side)?"▲":t.side==="PUT"||t.side==="MULTDOWN"?"▼":"◆")+" "+t.name+(mu?" "+(t.mult||100)+"x":t.ex?" "+t.ex+"s":"")+" • "+t.stake.toFixed(2)+tm+'</span><span style="display:flex;align-items:center;gap:8px">'+pl+xb+"</span></div>"}
function lists(){$("np").textContent=open.size;$("nh").textContent=hist.length;
  if($("dp").classList.contains("show"))$("dp").innerHTML=open.size?[...open.values()].reverse().map(t=>row(t,1)).join(""):'<div class="k"><span>No open positions</span></div>';
  if($("dh").classList.contains("show"))$("dh").innerHTML=hist.length?hist.map(t=>row(t,0)).join(""):'<div class="k"><span>No trades yet</span></div>'}
ovl();draw();
